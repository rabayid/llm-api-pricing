name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate the dataset
        run: node scripts/validate.mjs
      - name: Smoke-test the analysis script
        run: node scripts/crossover.mjs > /dev/null
